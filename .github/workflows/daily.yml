name: Ежедневен Хороскоп

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch: 

jobs:
  update-horoscope:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Изтегляне на кода
        uses: actions/checkout@v3

      - name: Подготовка на Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Инсталиране на нужните библиотеки
        run: pip install google-generativeai

      - name: Генериране на днешните зодии
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_content.py

      - name: Записване и публикуване на новите зодии
        run: |
          git config --global user.name "Horoscope Bot"
          git config --global user.email "bot@horoscope.local"
          git add data.json
          git commit -m "Автоматично обновяване на хороскопа" || exit 0
          git push
